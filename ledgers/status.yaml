  statement: Oracle CUSUM delay is predicted by the exact rate to about 10 %, and runs at 0.8-0.9 of h/I. At gamma=1e3, h=6.9, Cbar=0.4, s=0.5 - tau_c/c=20 extremum 4340(250) against h/I=5330 and mid-fringe 2010(170) against h/I_exact=2240 (the card leading order would give 910); tau_c/c=5 extremum 4260(240) and mid-fringe 7130(660) against 7780, so the extremum wins by 1.7x where the card leading order put the crossover; tau_c/c=1 mid-fringe 79000(6800) against 92700. The exact rate is a usable delay predictor; the card mid-fringe leading-order rate is not.
  status: result
