- id: C02
  statement: Exact mid-fringe lag correlation r_k = C^2 e^{-s^2} sinh(s^2 a_k); leading-order rate carries factor e^{-2 s^2}. PRIOR ART - this correlator is Wudarski et al. 2023 (Phys. Rev. Applied 19, 064066) Eq. 29 at phi_R = pi/2 under f_0 = s^2, f_k = s^2 a_k and the covariance-to-correlation normalisation, verified numerically to 3.1e-15; their Eq. 34 gives a_k. The card's leading-order rate retains the slope-loss resummation; the strict O(s^4) asymptote drops it and is 64.9 percent high at s=0.5. The two are now separate named functions, I_mid_slope and I_mid_strict (note 14); before 7 Sept 2026 a single ambiguous I_mid_lo carried the strict form under a card label. The exact correlator above is unaffected. The project's contribution is its use inside the spectral information-rate comparator and the sequential crossover, not the formula.
  status: result
  note: notes/2026-09-02-note-01.md#2a
  run: analysis/runs/sid_run2.py, sid_run3.py
  seed_ref: none (analytic)
  output: analysis/outputs/res2_partial.json
